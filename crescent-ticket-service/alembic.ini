# Alembic configuration. The database URL is NOT stored here: migrations/env.py
# reads DATABASE_URL from the environment / .env (see .env.example).
# Run from the project root:  alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Migration ids are short sequential numbers: 0001_..., 0002_...
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
